services:
  # BizFlow 360 Express.js + Socket.IO Backend Server (MediFlow / Arogya Blueprint)
  - type: web
    name: bizflow360-backend
    env: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: bizflow360_super_secret_jwt_key_2026
      - key: CORS_ORIGIN
        value: "*"
