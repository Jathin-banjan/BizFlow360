services:
  # BizFlow 360 Express.js Backend API
  - type: web
    name: bizflow360-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set to your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure random secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL, e.g. https://bizflow360.vercel.app
      - key: LOG_LEVEL
        value: info
